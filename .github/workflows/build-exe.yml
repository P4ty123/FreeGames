name: Crea JARVIS.exe

on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS/jarvis.py"
      - "JARVIS/requirements.txt"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write   # serve per pubblicare la Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r JARVIS/requirements.txt pyinstaller

      - name: Crea l'eseguibile
        working-directory: JARVIS
        run: >
          pyinstaller jarvis.py
          --name JARVIS
          --onefile
          --windowed
          --noconfirm
          --collect-all faster_whisper
          --collect-binaries ctranslate2

      - name: Verifica che l'exe esista
        working-directory: JARVIS
        shell: pwsh
        run: |
          if (-not (Test-Path dist/JARVIS.exe)) { throw "JARVIS.exe non creato" }
          "{0:N0} MB" -f ((Get-Item dist/JARVIS.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-exe
          path: JARVIS/dist/JARVIS.exe
          retention-days: 30

      # Solo sul branch main: pubblica l'exe come Release con un link fisso.
      - name: Pubblica la Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-v6.0.${{ github.run_number }}
          name: JARVIS 6.0 (build ${{ github.run_number }})
          make_latest: "true"
          body: |
            JARVIS, assistente AI locale (chat, memoria, allegati).
            Requisiti: Ollama installato e avviato, con i modelli scaricati
            (es. `ollama pull qwen3:14b`).
            Commit: ${{ github.sha }}
          files: JARVIS/dist/JARVIS.exe
